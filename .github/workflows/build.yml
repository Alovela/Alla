name: Собрать APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Сборка
        run: gradle assembleDebug --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk Mishka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mishka-apk
          path: Mishka.apk
      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Мишка 1.0.${{ github.run_number }}
          files: Mishka.apk
